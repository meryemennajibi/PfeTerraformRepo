name: Terraform CD

on:
  workflow_run:
    workflows: ["Terraform CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  terraform-cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_kali_admin_paswd: ${{ secrets.KALI_ADMIN_PASSWD }}
      TF_VAR_aks_admin_group_object_id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
      TF_VAR_cloud_admin_object_id: ${{ secrets.CLOUD_ADMIN_OBJECT_ID }}
      TF_VAR_security_analyst_object_id: ${{ secrets.SECURITY_ANALYST_OBJECT_ID }}
      TF_VAR_firewall_admin_group_object_id: ${{ secrets.FIREWALL_ADMIN_GROUP_OBJECT_ID }}
      TF_VAR_security_analyst_group_object_id: ${{ secrets.SECURITY_ANALYST_GROUP_OBJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group rg-aks-siso --name aks-cluster --overwrite-existing

      - name: Deploy Kubernetes manifests
        run: kubectl apply -f ../K8s-manifests/

