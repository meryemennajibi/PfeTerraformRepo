name: Terraform CD

on:
  workflow_run:
    workflows: ["Terraform CI"]
    types:
      - completed

jobs:
  terraform-cd:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_kali_admin_paswd: ${{ secrets.KALI_ADMIN_PASSWD }}
      TF_VAR_aks_admin_group_object_id: ${{ secrets.AKS_ADMIN_GROUP_OBJECT_ID }}
      TF_VAR_cloud_admin_object_id: ${{ secrets.CLOUD_ADMIN_OBJECT_ID }}
      TF_VAR_security_analyst_object_id: ${{ secrets.SECURITY_ANALYST_OBJECT_ID }}
      TF_VAR_security_analyst_group_object_id: ${{ secrets.SECURITY_ANALYST_GROUP_OBJECT_ID }}
      TF_VAR_firewall_admin_group_object_id: ${{ secrets.FIREWALL_ADMIN_GROUP_OBJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Import existing role assignment
        run: |
          terraform import -input=false \
            azurerm_role_assignment.security_analyst_firewall_network_contributor \
            "/subscriptions/8cbbdc36-8d1d-400e-b5a3-45d0b7797e6e/providers/Microsoft.Authorization/roleAssignments/232d4c8a0a49dbaae27ab71ee1baf1f5" || true


      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve



